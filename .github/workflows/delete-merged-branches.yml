name: Delete Merged Branches

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged GitFlow branch
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const headRef = pr.head.ref;
            const headRepo = pr.head.repo.full_name;
            const baseRepo = context.repo.owner + "/" + context.repo.repo;
            const allowedPrefixes = ["feature/", "bugfix/", "hotfix/", "release/"];

            if (headRepo !== baseRepo) {
              core.info(`Skipping branch deletion for external repository branch: ${headRepo}:${headRef}`);
              return;
            }

            if (!allowedPrefixes.some((prefix) => headRef.startsWith(prefix))) {
              core.info(`Skipping branch deletion for non-GitFlow branch: ${headRef}`);
              return;
            }

            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${headRef}`,
            });

            core.info(`Deleted merged branch: ${headRef}`);
